<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoolTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="top-bar">
            <a href="#"><i class="fa-solid fa-chevron-left"></i></a>
            <h1>your web dev</h1>
            <a href="#"><i class="fa-solid fa-ellipsis"></i></a>
        </header>

        <section class="profilo">
            <img class="avatar" src="img/logo.png" alt="Logo profilo">
            <h2>@breyan_dev</h2>

            <ul class="stats">
                <li><strong>312</strong> Following</li>
                <li><strong>18.4K</strong> Followers</li>
                <li><strong>420K</strong> Likes</li>
            </ul>

            <div class="azioni">
                <button class="follow">Follow</button>
                <button class="icona"><i class="fa-brands fa-instagram"></i></button>
                <button class="icona"><i class="fa-solid fa-caret-down"></i></button>
            </div>

            <p class="bio">
                web developer in crescita 💻<br>
                studente AI Web Development<br>
                ⬇️ i miei progetti ⬇️
            </p>
            <a class="link" href="https://github.com" target="_blank">https://github.com</a>
        </section>

        <nav class="tabs">
            <a href="#" class="attiva"><i class="fa-solid fa-table-cells"></i></a>
            <a href="#"><i class="fa-regular fa-heart"></i></a>
        </nav>

        <main class="griglia">
            <div class="tile"><img src="https://picsum.photos/id/1005/600/800" alt="Video 1"></div>
            <div class="tile"><img src="https://picsum.photos/id/1011/600/800" alt="Video 2"></div>
            <div class="tile"><img src="https://picsum.photos/id/1027/600/800" alt="Video 3"></div>
            <div class="tile"><img src="https://picsum.photos/id/1012/600/800" alt="Video 4"></div>
            <div class="tile"><img src="https://picsum.photos/id/1062/600/800" alt="Video 5"></div>
            <div class="tile"><img src="https://picsum.photos/id/1025/600/800" alt="Video 6"></div>
            <div class="tile"><img src="https://picsum.photos/id/1074/600/800" alt="Video 7"></div>
            <div class="tile"><img src="https://picsum.photos/id/1084/600/800" alt="Video 8"></div>
            <div class="tile"><img src="https://picsum.photos/id/1060/600/800" alt="Video 9"></div>
        </main>
    </div>
</body>

</html>
